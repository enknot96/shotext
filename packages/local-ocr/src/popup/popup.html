<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        box-sizing: border-box;
        margin: 0;
        width: 240px;
        padding: 12px;
        font-family: sans-serif;
        font-size: 13px;
      }
      kbd {
        background: #eee;
        border-radius: 4px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <h3>ショッテキ！- ShoText！</h3>
    <p><kbd>Alt+Shift+D</kbd> を押すと、範囲選択が始まります。</p>
    <p>選択範囲のOCR結果は、自動でクリップボードにコピーされます。</p>
    <p>Press <kbd>Alt+Shift+D</kbd> to start selecting an area.</p>
    <p>The recognized text is copied to your clipboard automatically.</p>
  </body>
</html>
